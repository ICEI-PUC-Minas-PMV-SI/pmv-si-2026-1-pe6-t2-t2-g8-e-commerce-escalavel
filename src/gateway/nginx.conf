events {
    worker_connections 1024;
}

http {

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    server {
        listen 80;

        absolute_redirect off;

        add_header Access-Control-Allow-Origin  "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── Healthcheck local do gateway ───────────────────
        location = /gateway/health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # ── Pública ──────────────────────────────────────────
        location /api/auth/ {
            proxy_pass       http://usersapi:8080/auth/;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Users health (sem auth) ──────────────────────────
        location = /api/users/health {
            proxy_pass       http://usersapi:8080/health;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Protegidas ───────────────────────────────────────
        location /api/users/ {
            proxy_pass       http://usersapi:8080/users/;
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        location = /api/stock/health {
            proxy_pass       http://stockapi:8080/health;
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/stock/ {
            proxy_pass       http://stockapi:8080/stock/;
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/catalog/ {
            proxy_pass       http://catalogapi:8080/;
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Orders ───────────────────────────────────────────
        location = /api/orders/health {
            proxy_pass       http://orderapi:8080/actuator/health;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders {
            rewrite ^/api/orders/?$ /orders break;
            rewrite ^/api/orders/(.*)$ /orders/$1 break;
            proxy_pass       http://orderapi:8080;
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Payments ─────────────────────────────────────────
        location = /api/payments/health {
            proxy_pass       http://paymentapi:8080/health;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payments/ {
            rewrite ^/api/payments/(.*)$ /payments/$1 break;
            proxy_pass       http://paymentapi:8080;
            proxy_set_header Host           $host;
            proxy_set_header X-Real-IP      $remote_addr;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
        
        # ── Rota não encontrada ──────────────────────────────
        location / {
            return 404 '{"error": "route not found"}';
            add_header Content-Type application/json;
        }
    }
}
