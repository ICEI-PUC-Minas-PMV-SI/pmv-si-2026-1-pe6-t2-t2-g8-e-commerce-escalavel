services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom123
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  user-service:
    build: .
    env_file: 
     - ../../.env
    ports:
      - "5001:5001"
    depends_on:
      - postgres

volumes:
  pgdata: