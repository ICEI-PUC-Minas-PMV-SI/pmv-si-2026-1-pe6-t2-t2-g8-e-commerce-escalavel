spring.application.name=OrderAPI
server.port=8080

# Banco de dados (PostgreSQL via env vars do docker-compose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=orders

# URLs dos outros microserviços
users.service.url=${USERS_URL}
stock.service.url=${STOCK_URL}
payment.service.url=${PAYMENT_URL}

# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL}

# Actuator health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never